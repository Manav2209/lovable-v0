name: eval-regression-gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install template deps (pre-warm node_modules for eval junction)
        working-directory: apps/template
        run: bun install --frozen-lockfile

      - name: Run eval baseline + regression gate
        working-directory: apps/evals
        env:
          AIROUTER_API_KEY: ${{ secrets.AIROUTER_API_KEY }}
          AIROUTER_BASE_URL: https://api.airouter.in/v1
          AIROUTER_MODEL: openai/gpt-4o-mini
          LLM_PROVIDER: airouter
          LANGFUSE_ENABLED: "0"
        run: bun run ./src/index.ts --gate thresholds.json --sleep-ms 500
