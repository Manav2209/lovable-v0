apiVersion: v1
kind: ServiceAccount
metadata:
  name: lovable-orchestrator
  namespace: lovable-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-orchestrator
  namespace: lovable-projects
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-orchestrator
  namespace: lovable-projects
subjects:
  - kind: ServiceAccount
    name: lovable-orchestrator
    namespace: lovable-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: project-orchestrator
